<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>the kitchen — before &amp; after</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#151311; --panel:#1d1a17; --ink:#f2ede4; --mut:#a89e90; --line:#2c2823; --acc:#d8b98a; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 90px}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(30px,6vw,44px);line-height:1.12;letter-spacing:-.01em}
  .sub{color:var(--mut);margin-top:12px;font-size:15px;max-width:52ch}
  .meta{color:#7c746a;font-size:12.5px;margin-top:22px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:34px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  figure{position:relative;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
  figure img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;opacity:.96}
  figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 12px 10px;font-size:12px;color:#e9e2d6;background:linear-gradient(transparent,rgba(10,9,8,.85))}
  figcaption .tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
  .reveal{grid-column:1/-1;aspect-ratio:16/8}
  .foot{margin-top:40px;color:#7c746a;font-size:13px;text-align:center}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">home · this month</div>
    <h1>the kitchen —<br>before &amp; after</h1>
    <p class="sub">the before is genuinely embarrassing, but hold on for the last one. the whole walkthrough is in there.</p>
    <div class="meta">8 photos · saved 2 days ago</div>
    <div class="grid">
      <figure><img src="/img-01.jpg" alt="kitchen before"><figcaption><span class="tag">before</span>day 1 — gutted the whole thing</figcaption></figure>
      <figure><img src="/img-02.jpg" alt="work in progress"><figcaption><span class="tag">wip</span>mid-teardown, don't judge the walls</figcaption></figure>
      <figure><img src="/img-03.jpg" alt="cabinets"><figcaption><span class="tag">cabinets</span>new ones went in — not bad</figcaption></figure>
      <figure><img src="/img-04.jpg" alt="countertop"><figcaption><span class="tag">countertop</span>the one we finally picked</figcaption></figure>
      <figure><img src="/img-05.jpg" alt="lighting"><figcaption><span class="tag">lighting</span>swapped the fixtures</figcaption></figure>
      <figure><img src="/img-06.jpg" alt="final"><figcaption><span class="tag">done</span>final walk-through</figcaption></figure>
      <figure class="reveal"><img src="/img-02.jpg" alt="video"><figcaption><span class="tag">video · 2:14</span>the whole thing, start to finish</figcaption></figure>
    </div>
    <p class="foot">shot on my phone, straight out of the camera roll</p>
  </div>
</body>
</html>
